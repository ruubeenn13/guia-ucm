name: CI

# Se ejecuta siempre en runners alojados por GitHub. Nunca en runners
# self-hosted: al ser un repositorio público, una PR desde un fork podría
# ejecutar código arbitrario dentro del homelab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos para todo el workflow.
permissions:
  contents: read

# Una PR que recibe varios pushes seguidos solo mantiene la última ejecución.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-test-backend
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --run

      - name: Build de producción
        run: npm run build
