# Perfil de tests.
#
# Los valores de conexión son de relleno: en los tests de integración los
# sustituye Testcontainers a través de `@ServiceConnection`. Existen solo
# para que resuelvan los marcadores de posición de `application.yml`, que a
# propósito no tienen valor por defecto.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sustituido_por_testcontainers
    username: test
    password: test

guia-ucm:
  cors-origin: http://localhost:5173

management:
  server:
    # Puerto aleatorio: así dos tests a la vez no se pisan.
    port: 0

logging:
  level:
    root: WARN
    dev.rubenlav.guiaucm: INFO
