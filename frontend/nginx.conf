# ─────────────────────────────────────────────────────────────────────
#  Nginx del contenedor web.
#
#  Sirve los estáticos ya construidos y hace de puerta única hacia la API,
#  de modo que el navegador solo habla con un origen. Escucha en el 8080
#  porque el proceso corre sin privilegios y un usuario normal no puede
#  abrir el puerto 80.
# ─────────────────────────────────────────────────────────────────────

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # No se anuncia la versión de Nginx.
    server_tokens off;

    # ── Cabeceras de seguridad ───────────────────────────────────────
    # Se aplican a todas las respuestas, incluidas las de error.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Lista blanca explícita:
    #   · imágenes: solo las nuestras y las carátulas de TMDB
    #   · iframes: solo el reproductor de YouTube sin cookies, para tráilers
    #   · scripts y conexiones: solo el propio origen
    # `style-src` admite estilos en línea porque las animaciones escriben
    # el atributo `style` de los elementos que mueven.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ── Compresión ───────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml application/problem+json;

    # ── API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://guia-ucm-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Nada de cuerpos grandes: la API solo recibe JSON pequeño.
        client_max_body_size 256k;
    }

    # Actuator jamás sale a internet: vive en el puerto de gestión del
    # backend, que solo escucha en la red interna de Docker.
    location /actuator {
        return 404;
    }

    # ── Estáticos ────────────────────────────────────────────────────
    # Los archivos con hash en el nombre se cachean para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # El HTML nunca se cachea: es lo que apunta a la versión desplegada.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Aplicación de una sola página: cualquier ruta desconocida devuelve
    # el index y es el enrutador del navegador quien decide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Salud del propio contenedor web.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
